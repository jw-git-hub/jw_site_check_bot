# Сайт-чекер @jw_site_check_bot (ТЗ, 13.3 и раздел 10). Имя проекта задано явно: папка с пробелами.
name: jw_site_check_bot

services:
  bot:
    build: .
    image: jw_site_check_bot:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # 384 МБ (ТЗ, С13): замер на сервере дал VmRSS 207 МБ при прежнем пределе 256 МБ (задача 33, раздел 20 ТЗ) —
    # разбор страницы переехал в отдельный процесс со своим пределом памяти (bot/site_check/parse_worker.py).
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 1.0
    pids_limit: 64
    dns: [1.1.1.1, 8.8.8.8]
    networks: [site_check]
    healthcheck:
      # файл обновляет сторож внутри бота раз в 10 секунд; перезапускает при зависании он же (ТЗ, 13.3)
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/alive') > 60)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  site_check:
    driver: bridge
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.name: br-sitecheck
    ipam:
      config:
        - subnet: 172.30.99.0/24
